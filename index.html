<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лор Леры и Даши: Сквозь года 💖</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0d0214;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            max-height: 850px;
            position: relative;
            background: linear-gradient(180deg, #1a0826 0%, #0d0214 100%);
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
            transition: background 0.5s ease;
        }

        #stat-bar {
            display: none;
            background: rgba(255, 255, 255, 0.07);
            padding: 10px 15px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-weight: bold;
            font-size: 14px;
            text-align: center;
            color: #f6ad55;
            text-shadow: 0 0 5px rgba(246, 173, 85, 0.4);
            z-index: 5;
        }

        .character-select {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
        }

        .char-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            margin-top: 30px;
        }

        .char-btn {
            background: linear-gradient(135deg, #e100ff, #7f00ff);
            border: none;
            color: white;
            padding: 16px;
            font-size: 18px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(127, 0, 255, 0.4);
            transition: transform 0.2s, filter 0.2s;
        }

        .char-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        #notification {
            position: absolute;
            top: 70px;
            left: 20px;
            right: 20px;
            background: rgba(236, 72, 153, 0.9);
            color: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            transform: translateY(-100px);
            opacity: 0;
            transition: all 0.5s ease;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        #notification.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* Окно для отображения фото персонажа */
        #sprite-container {
            display: none;
            height: 45%;
            width: 100%;
            justify-content: center;
            align-items: flex-end;
            margin-top: auto;
            position: relative;
            z-index: 2;
        }

        .character-sprite {
            max-height: 100%;
            max-width: 280px;
            object-fit: contain;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: all 0.3s ease-in-out;
            opacity: 0;
            transform: translateY(20px);
        }

        .character-sprite.active {
            opacity: 1;
            transform: translateY(0);
        }

        #story-interface {
            display: none;
            width: 100%;
            z-index: 3;
        }

        .dialog-box {
            background: rgba(20, 10, 30, 0.9);
            border: 2px solid #e100ff;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
        }

        .speaker-name {
            font-size: 18px;
            font-weight: bold;
            color: #00f0ff;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .story-text {
            font-size: 15px;
            line-height: 1.5;
            color: #f3e8ff;
        }

        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 10px;
        }

        .choice-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .choice-btn:hover {
            background: rgba(225, 0, 255, 0.2);
            border-color: #e100ff;
            transform: translateX(5px);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="notification">Улучшение отношений! 💖</div>
        <div id="stat-bar">Синхронизация лора: <span id="lp-score">0</span>%</div>

        <div id="setup-screen" class="character-select">
            <h1 style="background: linear-gradient(to right, #00f0ff, #e100ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Лор Леры и Даши ✨</h1>
            <p style="color: #a78bfa; font-size: 15px; line-height: 1.5; padding: 0 10px;">Добро пожаловать в игру! Теперь с реальными фотографиями главных героев лора. С чьей перспективы начнем?</p>
            <div class="char-buttons">
                <button class="char-btn" onclick="startGame('Даша')">Играть за Дашу 🌸</button>
                <button class="char-btn" onclick="startGame('Лера')">Играть за Леру ⚡</button>
            </div>
        </div>

        <!-- Контейнер для отображения фото персонажей -->
        <div id="sprite-container">
            <img id="char-photo" class="character-sprite" src="" alt="Персонаж">
        </div>

        <div id="story-interface">
            <div class="dialog-box">
                <div id="speaker" class="speaker-name">Автор</div>
                <div id="text" class="story-text">Загрузка воспоминаний...</div>
            </div>
            <div id="choices" class="choices-container"></div>
        </div>
    </div>

    <script>
        let mainCharacter = ""; 
        let lpPoints = 0; 
        let isCanon = true; 

        const locationsStyles = {
            start: "linear-gradient(180deg, #1a0826 0%, #0d0214 100%)",

            orbita: "linear-gradient(180deg, #2A4365 0%, #2D3748 100%)",  
            leto: "linear-gradient(180deg, #4A5568 0%, #2D3748 100%)", 
            inside: "linear-gradient(180deg, #2D3748 0%, #1A202C 100%)", 
            niva: "linear-gradient(180deg, #2A4365 0%, #1C3D5A 100%)", 
            niva_disco: "linear-gradient(180deg, #4c1d95 0%, #1e1b4b 100%)", 
            surf: "linear-gradient(180deg, #744210 0%, #442306 100%)"     
        };

        // Ссылки на файлы фотографий героев
        const characterImages = {
            "Лера": "lera.jpg",
            "Даша": "dasha.jpg",
            "Никита Клягин": "gopnik.jpg",
            "Федя": "fedya.jpg",
            "Саша": "sasha.jpg",
            "Автор": "", 
            "Прошлое": "",
            "Геленджик, лето 2024": "",
            "Ростов, 2023 год": "",
            "Альтернативная реальность": ""
        };

            start: {
                bg: "olginka",

                text: () => `Лето. Ольгинка. Вам по 13-14 лет. Вы отдыхаете с семьями. Папа Леры созванивается с мамой Даши, чтобы вас познакомить. Каков будет ответ Даши?`,
                choices: () => [
                    { text: "«Да обалдеть, конечно, пускай приходит!»", next: "beach_walk", lp: 15, msg: "Канон активирован! 🌟", canon: true },

                ]
            },
            beach_walk: {
                bg: "olginka",
                speaker: "Лера",
                text: () => `Мы гуляем на берегу моря. Разговор душевный. Я изливаю тебе душу про мальчика, а ты признаешься, что тебе скоро 14, а ты совершенно не умеешь целоваться! И тут я предлагаю решение...`,
                choices: () => [
                    { text: "«Спокойно, я тебя научу!» (Принять помощь Леры)", next: "orbita_lessons", lp: 15, msg: "Историческое решение 😂", canon: true }
                ]

            orbita_lessons: {
                bg: "orbita",
                speaker: "Даша",
                text: () => `Через пару дней на территории санатория «Орбита» под наш дикий хохот проходит легендарный мастер-класс по поцелуям. Внезапно появляется местный авторитет Никита Клягин!`,
                choices: () => [
                    { text: "Послушать, что скажет Никита", next: "gopnik_speech", lp: 0 }
                ]
            },
            gopnik_speech: {
                bg: "orbita",
                speaker: "Никита Клягин",
                text: () => `«Слыш, девчонки, а че вы тут делаете? Короче, предложение века: бросайте своих парней, гуляйте со мной!» \n\nВаша реакция на это щедрое предложение?`,
                choices: () => [
                    { text: "Послать Клягина и убежать вместе", next: "leto_space", lp: 15, msg: "Никита остался ни с чем! 👊", canon: true },
