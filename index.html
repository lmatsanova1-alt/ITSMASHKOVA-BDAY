<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лор Леры и Даши ✨</title>
    <style>
        body { margin:0; padding:0; font-family:sans-serif; background:#0d0214; color:#fff; display:flex; justify-content:center; align-items:center; height:100vh; overflow:hidden; }
        #game-container { width:100%; max-width:450px; height:100vh; max-height:850px; background:linear-gradient(180deg, #1a0826 0%, #0d0214 100%); box-shadow:0 0 30px rgba(0,0,0,0.8); display:flex; flex-direction:column; justify-content:space-between; padding:20px; box-sizing:border-box; }
        .scene { display:none; height:100%; flex-direction:column; justify-content:space-between; }
        .scene.active { display:flex; }
        .header-title { text-align:center; margin-top:40px; }
        .dialog-box { background:rgba(20,10,30,0.9); border:2px solid #e100ff; border-radius:16px; padding:18px; margin-bottom:12px; box-shadow:0 4px 20px rgba(0,0,0,0.6); }
        .speaker-name { font-size:18px; font-weight:bold; color:#00f0ff; margin-bottom:6px; }
        .story-text { font-size:15px; line-height:1.5; color:#f3e8ff; }
        .choices-container { display:flex; flex-direction:column; gap:10px; margin-bottom:40px; }
        .choice-btn { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.2); color:#fff; padding:14px; border-radius:10px; cursor:pointer; text-align:left; font-size:14px; width:100%; font-weight:500; border-style:solid; }
        .choice-btn:hover { background:rgba(225,0,255,0.2); border-color:#e100ff; }
        .char-btn { background:linear-gradient(135deg, #e100ff, #7f00ff); border:none; color:white; padding:16px; font-size:18px; border-radius:12px; cursor:pointer; font-weight:bold; text-align:center; width:100%; box-sizing:border-box; display:block; }
        .bad { color:#ef4444; } .good { color:#10b981; }
        .sprite-box { height: 250px; display: flex; justify-content: center; align-items: flex-end; margin-bottom: 10px; width: 100%; }
        .sprite-box img { max-height: 100%; max-width: 200px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.5); display: none; }
        .sprite-box img.active { display: block; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="scene-start" class="scene active">
            <div class="header-title"><h1 style="background:linear-gradient(to right, #00f0ff, #e100ff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; font-size:28px;">Лор Леры и Даши ✨</h1><p style="color:#a78bfa; font-size:15px; line-height:1.5;">Разные реплики и финалы для каждого персонажа. Пройди по воспоминаниям и откройте все 13 концовок!</p></div>
            <div class="choices-container"><button class="char-btn" onclick="startAs('Даша')">Играть за Дашу 🌸</button><button class="char-btn" onclick="startAs('Лера')">Играть за Леру ⚡</button></div>
        </div>
        <div id="game-screen" class="scene">
            <div style="margin-top:auto; width:100%;">
                <div class="sprite-box">
                    <img id="p-lera" src="lera.jpg">
                    <img id="p-dasha" src="dasha.jpg">
                    <img id="p-gopnik" src="gopnik.jpg">
                    <img id="p-fedya" src="fedya.jpg">
                    <img id="p-sasha" src="sasha.jpg">
                </div>
                <div class="dialog-box"><div id="speaker" class="speaker-name">Имя</div><div id="story-text" class="story-text">Текст...</div></div>
                <div id="choices-box" class="choices-container"></div>
            </div>
        </div>
    </div>
    <script>
        let hero = ""; let currentScene = "";
        const story = {
            olginka: {
                speaker: "Ольгинка: Начало",
                text: () => hero === "Даша" ? "Лето. Ольгинка. Тебе 13 лет. Вдруг мама говорит, что звонит папа какой-то Леры и хочет вас познакомить. Твоя реакция?" : "Лето. Ольгинка. Тебе 14 лет. Ты отдыхаешь с родителями и замечаешь классную девочку Дашу. Просишь папу набрать её маме. Что делаешь дальше?",
                choices: () => hero === "Даша" ? [{ t: "«Да обалдеть, конечно, пускай приходит!» 🌟", n: "beach" }, { t: "«Мне лень, я лучше буду спать в номере» 😴", n: "f2" }, { t: "Сбежать из отеля на пляж назло гиперопеке 🚔", n: "f3" }] : [{ t: "С нетерпением ждать ответа и бежать на встречу! 🌟", n: "beach" }, { t: "Передумать в последний момент и остаться в номере 😴", n: "f2" }, { t: "Убежать гулять дикарем без спроса родителей 🚔", n: "f3" }]
            },
            beach: {
                speaker: "Берег моря",
                text: () => hero === "Даша" ? "Вы долго общаетесь у моря. Лера изливает тебе душу насчет мальчика, который ей безумно нравится, а ты признаешься, что боишься взрослеть и совсем не умеешь целоваться..." : "Вы сидите на пляже. Ты честно излила Даше душу насчет мальчика, который тебе нравится. В ответ Даша робко признается, что переживает, ведь совсем не умеет целоваться! Твой шаг:",
                choices: () => hero === "Даша" ? [{ t: "Довериться Лере и принять её экспертную помощь 😂", n: "orbita" }, { t: "Засмущаться и перевести тему на шторм и тучи 🌤️", n: "f4" }, { t: "Предложить Лере: «Пошли лучше устроим ночной заплыв!» 🧜‍♀️", n: "f5" }] : [{ t: "Уверенно сказать: «Спокойно, Даш, я тебя научу!» 😂", n: "orbita" }, { t: "Постесняться развивать тему и заговорить о погоде 🌤️", n: "f4" }, { t: "Крикнуть: «В любой непонятной ситуации — идем плавать в шторм!» 🧜‍♀️", n: "f5" }]
            },
            orbita: {
                speaker: "Санаторий «Орбита»",
                text: () => hero === "Даша" ? "Прошло несколько дней. Территория санатория «Орбита». Под ваш дикий хохот Лера проводит мастер-класс по поцелуям. Вдруг выходит гопник Никита Клягин: «Слыш, девчонки, бросайте парней, гуляйте со мной!»" : "Проходит пару дней. Вы на территории «Орбиты». Под ваш дикий хохот ты официально проводишь для Даши мастер-класс. Но романтику прерывает Никита Клягин со своим: «Бросайте парней!»",
                choices: () => [{ t: hero === "Даша" ? "Спрятаться за Леру, послать Никиту и убежать вместе! 👊" : "Защитить Дашу, послать Клягина и убежать, держась за руки! 👊", n: "leto" }, { t: "Согласиться на предложение Клягина 🕶️", n: "f6" }, { t: hero === "Даша" ? "Подбадривать Леру: «Лерка, врежь ему!» 🥊" : "Вызвать Никиту Клягина на честный кулачный поединок! 🥊", n: "f7" }]
            },
            leto: {
                speaker: "Ростов, 2024 год",
                text: () => hero === "Даша" ? "Прошло много лет. Вы в Ростове. У пространства «Лето» Лера замечает своего знакомого Федю Тертерьянц. Он тебе понравился, Лера дает его ВК. Вы общаетесь месяц, и тут он кидает тебя в жесткий игнор. Твои действия?" : "2023 год, родной Ростов. Проходя мимо «Лета», ты замечаешь Федю Тертерьянц и понимаешь, что он запал Дашке в сердце. Ты даешь ей его ВК. Через месяц Федя уходит в жесткий игнор. Как спасаешь подругу?",
                choices: () => hero === "Даша" ? [{ t: "Расказать Лере. Объявить, что он дурак, и постоянно над ним угарать! 💅", n: "inside" }, { t: "Пойти штурмовать его подъезд с плакатами 👮‍♂️", n: "f8" }, { t: "Удалить ВК, заблокировать всех парней и уйти в монастырь ⛪", n: "f9" }] : [{ t: "Поддержать Дашу, объявить, что он дурак, и постоянно вместе над ним смеяться! 💅", n: "inside" }, { t: "Собрать группу захвата и поехать штурмовать его подъезд 👮‍♂️", n: "f8" }, { t: "Посоветовать Даше уйти в монастырь, а самой передавать ей латте через забор ⛪", n: "f9" }]
            },
            inside: {
                speaker: "Inside вайб",
                text: () => hero === "Даша" ? "Inside становится вашей базой. Вы пьете бабл ти, берете коктейли в «Красивых двадцатилетних», тайно мешаете Ягер в туалете кофейни. Спустя год Федя присылает тебе тикток: «Сегодня с 23:00 нельзя пить шампуни». Твой план?" : "Вы постоянно зависаете в Inside, пьете бабл ти, берете коктейли и тайно мешаете Ягер в туалете. Спустя год Федя неожиданно присылает Даше тикток про шампуни после 23:00. Начинаются качели. Что предпринимаешь?",
                choices: () => hero === "Даша" ? [{ t: "Начать операцию «Сталкер»: приходить в Inside и высматривать его! 🕵️‍♀️", n: "niva" }, { t: "Заработать кучу денег, выкупить Inside и запретить Феде вход 💸", n: "f10" }, { t: "Воспринять буквально и выпить шампунь «Маленькая Фея» назло ему 🧼", n: "f11" }] : [{ t: "Начать операцию «Сталкер»: ходить in Inside караулить и выслеживать его ради Дашки! 🕵️‍♀️", n: "niva" }, { t: "Помочь Даше открыть бизнес, выкупить Inside и уволить всех друзей Феди 💸", n: "f10" }, { t: "Срочно бежать в аптеку за средством от отравления, пока Даша пьет шампунь 🧼", n: "f11" }]
            },
            niva: {
                speaker: "Лагерь «Нива»",
                text: () => hero === "Даша" ? "Лето 2024. Геленджик, лагерь «Нива» от Ростсельмаша (путевки от пап). Вы приехали втроем с Сашей. Кругом идиоты, пикми Ева и Алина Малина бесят, спасают только песни Воскресенского. На 3-й день у вас истерика. На дискотеке Саша плачет и говорит, что ему тоже тошно. Что делаешь?" : "Лето 2024. Лагерь «Нива» в Геленджике при заводе. Ты приехала с Дашей и младшим братом Сашей. Вокруг кринж из шараг, пикми Ева и Алина Малина устраивают дурдом. Вас спасает только Воскресенский. На 3-й день рыдают уже все. Твой план на дискотеке:",
                choices: () => [{ t: hero === "Даша" ? "Подговорить Сашу и Леру набрать родителям и громко зaрeветь втроем ради эвакуации! 🚗💨" : "Скомандовать Саше и Даше звонить родителям и включить тройной ультра-рев ради спасения! 🚗💨", n: "f1" }, { t: "Не ждать машину родителей. Устроить ночной побег пешком через забор! 🏃‍♀️💨", n: "f12" }, { t: "Смириться, остаться до конца смены и дружить с Алиной Малиной 😭", n: "f13" }]
            },
            f1: { speaker: "Финал №1 🏆", text: () => hero === "Даша" ? "Дашка, с Днем Рождения! 🎉 Ты прошла мультивселенную за себя на идеальный канон! Уроки поцелуев в Орбите, великий побег от Клягина, Федя с его шампунями, Ягер в туалете Inside и наше эпичное тройное рыдание в «Ниве» ради эвакуации... Ты доказала, что твой выбор всегда ведет к лучшей дружбе! Будь самой счастливой! 💕" : "Дашка, с Днем Рождения! 🎉 Ты прошла этот сериал за Леру! Посмотрела на ваш легендарный лор моими глазами: как я учила тебя целоваться в Орбите, спасала от Клягина, помогала пережить качели с Феде и вела вас на великий побег из «Нивы». Наша дружба бесценна, безумно люблю тебя! ❤️", choices: () => [{ t: "Исследовать другие вселенные 🔄", n: "start" }] },
            f2: { speaker: "Финал №2 😴", text: () => hero === "Даша" ? "Ты осталась спать в номере. Вы с Лерой так и не встретились на берегу моря, лор вашей дружбы разрушился в самый первый день. Спустя годы ты просыпаешься в холодном поту и понимаешь, что у тебя нет ЛП, с которой можно мешать Ягер в туалете." : "Даша осталась спать, и твоя инициатива провалилась. Ольгинский лор разрушен, вы остались просто далекими знакомыми, а Федя Тертерьянц так и не узнал, какая Даша крутая сталкерша. Не канон! ❌", choices: () => [{ t: "Откатить время назад ↩️", n: "start" }] },
            f3: { speaker: "Финал №3 🚔", text: () => hero === "Даша" ? "Ты сбежала из отеля, но вас с Лерой поймали местные спасатели на банане прямо в Ольгинке. Родители заперли тебя в номере до конца лета, и вместо душевных разговоров вы общались стуком через стенку!" : "Твой побег дикарем закончился перехватом: вас с Дашей поймали спасатели на пляжном банане. Родители устроили тотальный домашний арест. Вместо мастер-классов по поцелуям вы грустно стучите друг другу через стенку.", choices: () => [{ t: "Начать сначала ↩️", n: "start" }] },
            f4: { speaker: "Финал №4 🌤️", text: () => "Вы постеснялись говорить на личные темы и весь вечер обсуждали циклон над Геленджиком. Разговор не склеился, вы остались просто знакомыми. Мастер-класс в «Орбите» стерт из истории. Какая скука!", choices: () => [{ t: "Переиграть ↩️", n: "start" }] },
            f5: { speaker: "Финал №5 🧜‍♀️", text: () => "Вы уплыли в шторм. Вас унесло течением к берегам Турции. Теперь вы работаете аниматорами в Анталье, учите турецкий и пьете турецкий кофе вместо латте в Surf на Пушке.", choices: () => [{ t: "Вернуться в Ольгинку ↩️", n: "olginka" }] },
            f6: { speaker: "Финал №6 🕶️", text: () => hero === "Даша" ? "Ты согласилась пойти с Никитой. Спустя годы ты замужем за Клягин, носишь спортивки три полоски, а вместо Surf x ASP вы пьете пиво на лавке у санатория. Федя Тертерьянц боится заходить в ваш район. Какой кошмар!" : "Даша согласилась пойти с Никитой. Спустя годы она замужем за Клягин, носит спортивки три полоски, а вместо Surf x ASP вы пьете пиво на лавке у санатория. Федя Тертерьянц боится заходить в ваш район. Какой кошмар!", choices: () => [{ t: "Срочно спасти Дашу от Никиты! ↩️", n: "start" }] },
            f7: { speaker: "Финал №7 🥊", text: () => hero === "Даша" ? "Лера уложила Никиту Клягина одним левым хуком в челюсть под аплодисменты отдыхающих. Вы стали легендами Ольгинки, Никита теперь работает вашим личным охранником и носит за вами бабл ти." : "Ты уложила Никиту Клягина одним левым хуком в челюсть под аплодисменты отдыхающих. Вы стали легендами Ольгинки, Никита теперь работает вашим личным охранником и носит за вами бабл ти.", choices: () => [{ t: "Продолжить путь в 2023 год ➡️", n: "leto" }] },
            f8: { speaker: "Финал №8 👮‍♂️", text: () => "Вы поехали штурмовать подъезд Феди. Устроили такой крик и перформанс, что Федя вызвал police Ростова. Теперь вам законодательно запрещено приближаться к Феде и пространству «Лето» ближе чем на 500 метров. Лор сломан!", choices: () => [{ t: "Выбрать каноничный смех ↩️", n: "start" }] },
            f9: { speaker: "Финал №9 ⛪", text: () => hero === "Даша" ? "Ты ушла в монастырь. Там строгий устав: бабл ти пить запрещено, Ягермейстер приравнивается к греху, а тиктоки про шампуни после 23:00 признаны ересью. Лера регулярно приезжает и пытается передать тебе контрабандный латте из Surf через забор." : "Даша ушла в монастырь. Там строгий устав: бабл ти пить запрещено, Ягермейстер приравнивается к греху, а тиктоки про шампуни после 23:00 признаны ересью. Ты регулярно приезжаешь и пытаешься передать ей контрабандный латте из Surf через забор.", choices: () => [{ t: "Вернуть Дашу в мирской Ростов ↩️", n: "start" }] },
            f10: { speaker: "Финал №10 💸", text: () => "Вы выкупили кофейню! Теперь вы самые богатые двадцатилетние в городе. Вы открыли сеть «Ягер-Бабл-Ти». Федя Тертерьянц устроился к вам на работу баристой и умоляет Дашу ответить ему в ВК, но вы слишком заняты подсчетом прибыли. Потрясающий финал!", choices: () => [{ t: "Но путевки в «Ниву» всё равно ждут... ➡️", n: "niva" }] },
            f11: { speaker: "Финал №11 🧼", text: () => hero === "Даша" ? "Ты восприняла слова Феди буквально и выпила шампунь после 23:00. Всю ночь вы с Лерой провели в больнице Ростова, пуская мыльные пузыри. Федя Тертерьянц испугался вашей суровости и уехал из города навсегда." : "Даша восприняла слова Феди буквально и выпила шампунь после 23:00. Всю ночь вы с ней провели в больнице Ростова, пуская мыльные пузыри. Федя Тертерьянц испугался вашей суровости и уехал из города навсегда.", choices: () => [{ t: "Не пить шампуни ↩️", n: "start" }] },
            f12: { speaker: "Финал №12 🏃‍♀️💨", text: () => "Вы перелезли через забор лагеря «Нива» ночью под песни Воскресенского. Шли пешком по трассе М4-Дон, отбиваясь от пикми-девочек Евы и Алины Малины. Родители в шоке, но вы доказали свою независимость и победно ворвались в Ростов на попутке! Легендарный исход.", choices: () => [{ t: "Зайти в Surf на Пушке за наградой 🎁", n: "f1" }] },
            f13: { speaker: "Финал №13 😭", text: () => "Вы остались до конца смены. Алина Малина поглотила ваше сознание, вы стали главными пикми лагеря, забыли про Inside, а младший брат Саша до сих пор ходит на те кринжовые дискотеки. Вы упустили свой каноничный лор!", choices: () => [{ t: "Организовать эвакуацию! ↩️", n: "niva" }] }
        };
        function startAs(chosenHero) { hero = chosenHero; document.getElementById("scene-start").classList.remove("active"); document.getElementById("game-screen").classList.add("active"); go("olginka"); }
        function go(sceneKey) {
            if(sceneKey === "start") { document.getElementById("game-screen").classList.remove("active"); document.getElementById("scene-start").classList.add("active"); return; }
            currentScene = sceneKey; const data = story[sceneKey];
            document.getElementById("speaker").innerText = typeof data.speaker === "function" ? data.speaker() : data.speaker;
            document.getElementById("story-text").innerText = data.text();
            var sp = data.speaker; if (typeof sp === "function") sp = sp();
            document.querySelectorAll('.sprite-box img').forEach(i => i.classList.remove('active'));
            if (sp === "Лера" || (sp === "Имя" && hero === "Лера")) document.getElementById("p-lera").classList.add("active");
            if (sp === "Даша" || (sp === "Имя" && hero === "Даша")) document.getElementById("p-dasha").classList.add("active");
            if (sp === "Никита Клягин") document.getElementById("p-gopnik").classList.add("active");
            if (sp === "Федя") document.getElementById("p-fedya").classList.add("active");
            if (sp === "Саша (Брат)") document.getElementById("p-sasha").classList.add("active");
            const box = document.getElementById("choices-box"); box.innerHTML = "";
            data.choices().forEach(c => { const btn = document.createElement("button"); btn.className = "choice-btn"; btn.innerText = c.t; btn.onclick = () => go(c.n); box.appendChild(btn); });
        }
    </script>
</body>
</html>
