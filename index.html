<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лор Леры и Даши: Сквозь года 💖</title>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; background: #0d0214; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #game-container { width: 100%; max-width: 450px; height: 100vh; max-height: 850px; position: relative; background: linear-gradient(180deg, #1a0826 0%, #0d0214 100%); box-shadow: 0 0 30px rgba(0,0,0,0.8); display: flex; flex-direction: column; justify-content: space-between; padding: 20px; box-sizing: border-box; transition: background 0.5s ease; }
        #stat-bar { display: none; background: rgba(255, 255, 255, 0.07); padding: 10px 15px; border-radius: 20px; backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); font-weight: bold; font-size: 14px; text-align: center; color: #f6ad55; text-shadow: 0 0 5px rgba(246, 173, 85, 0.4); z-index: 5; }
        .character-select { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; }
        .char-buttons { display: flex; flex-direction: column; gap: 15px; width: 100%; margin-top: 30px; }
        .char-btn { background: linear-gradient(135deg, #e100ff, #7f00ff); border: none; color: white; padding: 16px; font-size: 18px; border-radius: 12px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 15px rgba(127, 0, 255, 0.4); transition: transform 0.2s; z-index: 10; position: relative; }
        .char-btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
        #notification { position: absolute; top: 70px; left: 20px; right: 20px; background: rgba(236, 72, 153, 0.9); color: white; padding: 10px; border-radius: 8px; text-align: center; font-weight: bold; font-size: 14px; transform: translateY(-100px); opacity: 0; transition: all 0.5s ease; z-index: 10; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        #notification.show { transform: translateY(0); opacity: 1; }
        #sprite-container { display: none; height: 45%; width: 100%; justify-content: center; align-items: flex-end; margin-top: auto; position: relative; z-index: 2; }
        .character-sprite { max-height: 100%; max-width: 280px; object-fit: contain; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); transition: all 0.3s ease-in-out; opacity: 0; transform: translateY(20px); }
        .character-sprite.active { opacity: 1; transform: translateY(0); }
        #story-interface { display: none; width: 100%; z-index: 3; }
        .dialog-box { background: rgba(20, 10, 30, 0.9); border: 2px solid #e100ff; border-radius: 16px; padding: 18px; margin-bottom: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); backdrop-filter: blur(8px); }
        .speaker-name { font-size: 18px; font-weight: bold; color: #00f0ff; margin-bottom: 6px; letter-spacing: 0.5px; }
        .story-text { font-size: 15px; line-height: 1.5; color: #f3e8ff; }
        .choices-container { display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
        .choice-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; padding: 12px; border-radius: 10px; cursor: pointer; text-align: left; font-size: 14px; transition: all 0.2s ease; }
        .choice-btn:hover { background: rgba(225, 0, 255, 0.2); border-color: #e100ff; transform: translateX(5px); }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="notification">Улучшение отношений! 💖</div>
        <div id="stat-bar">Синхронизация лора: <span id="lp-score">0</span>%</div>

        <div id="setup-screen" class="character-select">
            <h1 style="background: linear-gradient(to right, #00f0ff, #e100ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Лор Леры и Даши ✨</h1>
            <p style="color: #a78bfa; font-size: 15px; line-height: 1.5; padding: 0 10px;">Добро пожаловать в игру! Каждое правильное решение приближает к открытию главного секретного поздравления. Начнем воссоздавать историю?</p>
            <div class="char-buttons">
                <button class="char-btn" id="btn-dasha">Играть за Дашу 🌸</button>
                <button class="char-btn" id="btn-lera">Играть за Леру ⚡</button>
            </div>
        </div>

        <div id="sprite-container"><img id="char-photo" class="character-sprite" src="" alt="Персонаж"></div>

        <div id="story-interface">
            <div class="dialog-box">
                <div id="speaker" class="speaker-name">Автор</div>
                <div id="text" class="story-text">Загрузка воспоминаний...</div>
            </div>
            <div id="choices" class="choices-container"></div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            let mainCharacter = ""; let lpPoints = 0; let isCanon = true;
            const locationsStyles = { start: "linear-gradient(180deg, #1a0826 0%, #0d0214 100%)", olginka: "linear-gradient(180deg, #1A365D 0%, #2A4365 100%)", orbita: "linear-gradient(180deg, #2A4365 0%, #2D3748 100%)", leto: "linear-gradient(180deg, #4A5568 0%, #2D3748 100%)", inside: "linear-gradient(180deg, #2D3748 0%, #1A202C 100%)", niva: "linear-gradient(180deg, #2A4365 0%, #1C3D5A 100%)", niva_disco: "linear-gradient(180deg, #4c1d95 0%, #1e1b4b 100%)", surf: "linear-gradient(180deg, #744210 0%, #442306 100%)" };
            const characterImages = { "Лера": "lera.jpg", "Даша": "dasha.jpg", "Никита Клягин": "gopnik.jpg", "Федя": "fedya.jpg", "Саша": "sasha.jpg" };

            const storyData = {
                start: { bg: "olginka", speaker: "Прошлое", text: () => `Лето. Ольгинка. Вам по 13-14 лет. Вы отдыхаете с семьями. Папа Леры созванивается с мамой Даши, чтобы вас познакомить. Каков будет ответ Даши?`, choices: () => [ { text: "«Да обалдеть, конечно, пускай приходит!»", next: "beach_walk", lp: 15, msg: "Канон активирован! 🌟", canon: true }, { text: "«Ой, мне лень, я побуду в номере»", next: "non_canon_end", lp: 0, canon: false } ] },
                beach_walk: { bg: "olginka", speaker: "Лера", text: () => `Мы гуляем на берегу моря. Разговор душевный. Я изливаю тебе душу про мальчика, а ты признаешься, что тебе скоро 14, а ты совершенно не умеешь целоваться! И тут я предлагаю решение...`, choices: () => [ { text: "«Спокойно, я тебя научу!» (Принять помощь Леры)", next: "orbita_lessons", lp: 15, msg: "Историческое решение 😂", canon: true } ] },
                orbita_lessons: { bg: "orbita", speaker: "Даша", text: () => `Через пару дней на территории санатория «Орбита» под наш дикий хохот проходит легендарный мастер-класс по поцелуям. Внезапно появляется местный авторитет Никита Клягин!`, choices: () => [ { text: "Послушать, что скажет Никита", next: "gopnik_speech", lp: 0 } ] },
                gopnik_speech: { bg: "orbita", speaker: "Никита Клягин", text: () => `«Слыш, девчонки, а че вы тут делаете? Короче, предложение века: бросайте своих парней, гуляйте со мной!» \n\nВаша реакция на это щедрое предложение?`, choices: () => [ { text: "Послать Клягина и убежать вместе", next: "leto_space", lp: 15, msg: "Никита остался ни с чем! 👊", canon: true }, { text: "Уйти в закат с Никитой", next: "gopnik_end", lp: 0, canon: false } ] },
                leto_space: { bg: "leto", speaker: "Ростов, 2023 год", text: () => `Время идет! На календаре 2023 год, Ростов-на-Дону. Мы проходим мимо пространства «Лето» и замечаем моего знакомого — Федю Тертерьянц. Он сразу тебе понравился, и я решаю помочь...`, choices: () => [ { text: "Взять у Леры его ВК для знакомства", next: "fedya_ghost", lp: 15, msg: "Федческий лор начался! ⚡", canon: true } ] },
                fedya_ghost: { bg: "inside", speaker: "Даша", text: () => `Мы общаются целый месяц, всё идет круто, но потом Федя резко уходит в полный игнор и перестает отвечать... Что мы делаем?`, choices: () => [ { text: "Объявить Лере, что он дурак, и постоянно над ним угарать", next: "inside_life", lp: 15, msg: "Идеальная тактика! 💅", canon: true } ] },
                inside_life: { bg: "inside", speaker: "Лера", text: () => `«Inside» становится нашим убежищем. Мы гуляем тут с 2023 года, пьем бабл ти, берете коктейли в «Красивых двадцатилетних» и тайно мешаем Ягермейстер в туалете кофейни! Но спустя год Федя внезапно присылает тебе тикток: «Сегодня с 23:00 нельзя пить шампуни»...`, choices: () => [ { text: "Начать операцию «Сталкер» в Inside", next: "tiktok_shampoo", lp: 15, msg: "Миссия: Топ Сталкер 🕵️‍♀️", canon: true }, { text: "Забить на него", next: "non_canon_end", lp: 0, canon: false } ] },
                tiktok_shampoo: { bg: "inside", speaker: "Федя", text: () => `Начинаются бесконечные эмоциональные качели. Но мы не сдаемся: регулярно приходим в Inside, чтобы его высматривать и сталкерить! Переносимся в будущее?`, choices: () => [ { text: "Переместиться в лето 2024 года", next: "niva_arrival", lp: 0 } ] },
                niva_arrival: { bg: "niva", speaker: "Геленджик, лето 2024", text: () => `Лето 2024 года. Наши папы достают нам путевки от завода «Ростсельмаш» в лагерь «Нива» в Геленджике. Мы приезжаем туда втроем: я, ты и мой младший брат Саша. Но реальность — кошмар. Кругом идиоты, все ушли в шараги, мы одни перешли в 10 класс. Ева и Алина Малина устраивают пикми-кринж. Наше единственное спасение:`, choices: () => [ { text: "Включать на репите песни Воскресенского", next: "niva_hysteria", lp: 15, msg: "Музыкальное спасение! 🎵", canon: true } ] },
                niva_hysteria: { bg: "niva", speaker: "Даша", text: () => `Через 2 дня у нас начинается дикая истерика. Родители не верят, думают, мы выпендриваемся. Нас насильно гонят на лагерную дискотеку... Но тут к нам подходит Саша.`, choices: () => [ { text: "Послушать Сашу", next: "sasha_speech", lp: 10 } ] },
